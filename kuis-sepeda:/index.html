<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Persona Sepeda AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6">

  <div class="max-w-xl w-full bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">
    
    <!-- START SCREEN -->
    <div id="start-screen" class="p-6 md:p-8 text-center space-y-6">
      <div class="relative w-full h-48 rounded-2xl overflow-hidden border border-slate-800">
        <img src="https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=800&q=80" alt="Cycling" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent"></div>
      </div>
      <div>
        <span class="inline-block px-3 py-1 bg-indigo-500/10 text-indigo-400 rounded-full text-xs font-semibold tracking-wider uppercase mb-2">AI-Powered Quiz</span>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">Temukan Persona Sepeda Idealmu</h1>
        <p class="text-slate-400 text-sm mt-2 leading-relaxed">Jawab 8 pertanyaan visual ini untuk merakit sepeda kustom impianmu lewat AI secara real-time.</p>
      </div>
      <button onclick="startQuiz()" class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/30 active:scale-[0.98]">
        Mulai Kuis
      </button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden p-6 md:p-8 space-y-5">
      <!-- Progress Bar -->
      <div>
        <div class="flex justify-between items-center text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
          <span id="question-number">Pertanyaan 1 dari 8</span>
          <span id="progress-percent" class="text-indigo-400">12%</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700/50">
          <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <!-- Gambar Pertanyaan -->
      <div class="relative w-full h-40 sm:h-48 rounded-2xl overflow-hidden border border-slate-800">
        <img id="question-image" src="" alt="Ilustrasi Pertanyaan" class="w-full h-full object-cover transition-all duration-500">
      </div>

      <!-- Teks Pertanyaan -->
      <h2 id="question-text" class="text-base sm:text-lg font-bold text-white leading-snug"></h2>

      <!-- Pilihan Jawaban -->
      <div id="options-container" class="space-y-2.5"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="hidden p-6 md:p-8 text-center space-y-6">
      <div class="uppercase tracking-widest text-xs font-extrabold text-indigo-400">Hasil Persona Kamu</div>
      
      <!-- Slot Foto Sepeda Hasil AI -->
      <div class="relative w-full h-64 bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-inner flex items-center justify-center">
        <!-- Indikator Loading AI -->
        <div id="image-loader" class="flex flex-col items-center justify-center p-6 space-y-3">
          <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs font-semibold text-indigo-300 animate-pulse">🎨 AI sedang merakit sepedamu...</p>
        </div>
        <!-- Gambar Output -->
        <img id="result-image" src="" alt="Foto Hasil Sepeda AI" class="w-full h-full object-cover hidden">
      </div>

      <div>
        <h2 id="result-title" class="text-2xl sm:text-3xl font-black text-white"></h2>
        <p id="result-subtitle" class="text-indigo-400 font-semibold text-sm mt-1"></p>
      </div>

      <p id="result-desc" class="text-slate-300 text-sm leading-relaxed text-justify bg-slate-950/60 p-4 rounded-2xl border border-slate-800"></p>

      <div id="result-motto" class="italic text-xs font-medium text-slate-400 border-l-2 border-indigo-500 pl-3 text-left"></div>

      <button onclick="restartQuiz()" class="w-full py-3.5 px-6 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition-all border border-slate-700">
        Ulangi Kuis
      </button>
    </div>

  </div>

  <script>
    const questions = [
      {
        question: "1. Kalau dapat jatah gowes bebas seharian, rute mana yang paling bikin kamu bersemangat?",
        image: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Aspal mulus antar-kota dengan tanjakan & turunan tajam", type: "road" },
          { text: "Trek tanah, melompati bebatuan & akar pohon di alam liar", type: "mtb" },
          { text: "Jalur campuran: aspal pecah, jalan semen & kerikil", type: "gravel" },
          { text: "Keliling pusat kota, kombinasikan dengan naik kereta/LRT", type: "folding" },
          { text: "Menyelinap lincah di tengah padatnya lalu lintas kota", type: "fixie" },
          { text: "Rute santai dalam kota dengan tujuan akhir tempat nongkrong hits", type: "kalcer" }
        ]
      },
      {
        question: "2. Apa pencapaian utama yang ingin kamu dapatkan setelah selesai gowes?",
        image: "https://images.unsplash.com/photo-1517649763962-0c6232661a0b?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Memecahkan rekor kecepatan rata-rata (average speed)", type: "road" },
          { text: "Menaklukkan rintangan ekstrem & memicu adrenalin", type: "mtb" },
          { text: "Menjelajahi tempat baru yang jarang dilalui orang", type: "gravel" },
          { text: "Perjalanan harian efisien, bebas macet & hemat energi", type: "folding" },
          { text: "Merasakan ritme kayuhan murni & koneksi jalanan", type: "fixie" },
          { text: "Menikmati suasana, ngobrol bareng teman & refreshing", type: "kalcer" }
        ]
      },
      {
        question: "3. Gaya berpakaian seperti apa yang paling menggambarkan dirimu saat sepedaan?",
        image: "https://images.unsplash.com/photo-1508215885820-4585e56135c8?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Jersey skin-fit aerodinamis, bib shorts & cleat balap", type: "road" },
          { text: "Jersey tahan robek, celana loose, helm trail & knee pad", type: "mtb" },
          { text: "Kaos technical, cargo shorts & sepatu gravel fungsional", type: "gravel" },
          { text: "Pakaian kerja atau baju harian kasual yang rapi", type: "folding" },
          { text: "Streetwear, kaus grafis oversize & sneakers favorit", type: "fixie" },
          { text: "Vintage jersey, kemeja pola atau gaya retro estetik", type: "kalcer" }
        ]
      },
      {
        question: "4. Aksesori atau fitur apa yang HARUS ada di sepedamu?",
        image: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Cyclocomputer (GPS/Speed) untuk pantau data performa", type: "road" },
          { text: "Suspensi empuk & ban tubeless berulir tebal", type: "mtb" },
          { text: "Tas bikepacking & tempat botol minum ekstra", type: "gravel" },
          { text: "Front block / tas depan & engsel lipat yang kokoh", type: "folding" },
          { text: "Toe strap / pedal cleat dengan setup stang bersih tanpa kabel", type: "fixie" },
          { text: "Keranjang depan, rak kustom & lampu klasik estetik", type: "kalcer" }
        ]
      },
      {
        question: "5. Kalau mendadak ban bocor di tengah jalan, apa reaksimu?",
        image: "https://images.unsplash.com/photo-1559348349-86f1f65817fe?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Langsung pakai CO2 inflator & kit tambal, kelar < 5 menit", type: "road" },
          { text: "Santai saja, itu bagian dari petualangan di jalur trail", type: "mtb" },
          { text: "Buka tas frame, ambil multi-tool, perbaiki mandiri", type: "gravel" },
          { text: "Lipat sepedanya, panggil taksi online atau naik bus", type: "folding" },
          { text: "Setup sepedaku simpel, perbaikan bisa beres dengan cepat", type: "fixie" },
          { text: "Berhenti dulu, cari bengkel terdekat sambil ngopi", type: "kalcer" }
        ]
      },
      {
        question: "6. Tempat favoritmu untuk berhenti sejenak (pit stop) dan melepas lelah?",
        image: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Minimarket jalan nasional buat refill isotonik & pisang", type: "road" },
          { text: "Warung lokal di puncak bukit/pos pendaftaran jalur", type: "mtb" },
          { text: "Kedai tersembunyi (hidden gem) di pelosok desa", type: "gravel" },
          { text: "Kafe ramah sepeda di pusat kota / foodcourt stasiun", type: "folding" },
          { text: "Skatepark, taman kota, atau area kumpul anak muda", type: "fixie" },
          { text: "Specialty coffee shop berarsitektur estetik & kekinian", type: "kalcer" }
        ]
      },
      {
        question: "7. Faktor paling krusial yang menentukan keputusanmu membeli sepeda?",
        image: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Bobot keseluruhan super ringan & efisiensi aerodinamis", type: "road" },
          { text: "Ketahanan frame serta kualitas traksi & suspensi", type: "mtb" },
          { text: "Clearance ban lebar & opsi dudukan tas/rak yang banyak", type: "gravel" },
          { text: "Kemudahan & kepraktisan saat dilipat serta disimpan", type: "folding" },
          { text: "Kesederhanaan komponen, perawatan mudah & geometri tajam", type: "fixie" },
          { text: "Kombinasi warna, keunikan frame & estetika visual", type: "kalcer" }
        ]
      },
      {
        question: "8. Foto atau video seperti apa yang paling sering kamu unggah setelah gowes?",
        image: "https://images.unsplash.com/photo-1511994298241-608e28f14fde?auto=format&fit=crop&w=800&q=80",
        options: [
          { text: "Screenshot grafik Strava berisi data kecepatan & elevasi", type: "road" },
          { text: "Video melibas turunan tanah / foto sepeda belepotan lumpur", type: "mtb" },
          { text: "Lanskap pemandangan alam dengan sepeda di sampingnya", type: "gravel" },
          { text: "Sepeda terlipat rapi di samping meja kafe atau dalam kereta", type: "folding" },
          { text: "Foto action shot saat skidding / jalanan malam kota", type: "fixie" },
          { text: "Foto candid estetik bareng teman di spot nongkrong keren", type: "kalcer" }
        ]
      }
    ];

    const resultsData = {
      road: {
        title: "Road Bike",
        subtitle: "The Speed Demon / Si Ambisius Aerodinamis",
        desc: "Kamu adalah orang yang berorientasi pada target, disiplin, dan selalu ingin menjadi versi terbaik dari dirimu. Bagi kamu, bersepeda bukan sekadar jalan-jalan santai, tapi tentang efisiensi, kecepatan, dan melampaui rekor pribadi.",
        motto: "\"Bukan cuma soal seberapa jauh jalurnya, tapi seberapa cepat kamu menaklukkannya.\"",
        img: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=800&q=80"
      },
      mtb: {
        title: "Mountain Bike (MTB)",
        subtitle: "The Trailblazer / Si Tangguh Pemburu Adrenalin",
        desc: "Kamu adalah pribadi yang pemberani, suka tantangan, dan paling segar kalau berada di tengah alam terbuka. Rutinitas yang membosankan adalah musuh utamamu. Kamu butuh sepeda yang tangguh dan siap diajak menerjang rintangan.",
        motto: "\"Makin ekstrem jalurnya, makin seru ceritanya.\"",
        img: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=800&q=80"
      },
      gravel: {
        title: "Gravel Bike",
        subtitle: "The Explorer / Si Penjelajah Tanpa Batas",
        desc: "Kamu adalah sosok yang fleksibel, adaptif, dan selalu penasaran dengan hal-hal baru. Kamu paling gak suka dikotak-kotakkan oleh aturan rigid. Jalur aspal mulus oke, jalanan tanah berkerikil hayuk!",
        motto: "\"Pilih rute paling seru, nikmati setiap jenis permukaannya.\"",
        img: "https://images.unsplash.com/photo-1508215885820-4585e56135c8?auto=format&fit=crop&w=800&q=80"
      },
      folding: {
        title: "Folding Bike",
        subtitle: "The Urban Commuter / Si Praktis & Efisien",
        desc: "Kamu mengutamakan kepraktisan, efisiensi, dan mobilitas tinggi. Buat kamu, hidup harus dibawa simpel dan cerdas tanpa ribet urusan parkir atau penyimpanan.",
        motto: "\"Simpel dilipat, fleksibel melipat jarak.\"",
        img: "https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?auto=format&fit=crop&w=800&q=80"
      },
      fixie: {
        title: "Fixed Gear",
        subtitle: "The Minimalist Rebel / Si Ekspresif Penakluk Kota",
        desc: "Kamu adalah pribadi yang berani beda, percaya diri, dan menyukai kontrol penuh atas apa yang kamu lakukan. Kamu menyukai hal-hal yang otentik, estetik, tapi tetap menantang.",
        motto: "\"Satu gigi, tanpa rem, kontrol penuh ada di kakimu.\"",
        img: "https://images.unsplash.com/photo-1507035895480-2b3156c31fc8?auto=format&fit=crop&w=800&q=80"
      },
      kalcer: {
        title: "Sepeda Kalcer",
        subtitle: "The Vibe Master / Si Santai Penikmat Kultur",
        desc: "Kamu adalah penikmat estetika, seni, dan gaya hidup. Buat kamu, bersepeda bukan soal mandi keringat atau pamer kecepatan, melainkan tentang vibe, berekspresi, dan menikmati momen.",
        motto: "\"Gowes pelan-pelan, yang penting gaya dan vibe-nya dapet.\"",
        img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&w=800&q=80"
      }
    };

    let currentQuestionIndex = 0;
    let scores = { road: 0, mtb: 0, gravel: 0, folding: 0, fixie: 0, kalcer: 0 };

    function startQuiz() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestionIndex];
      const progressPercent = Math.round(((currentQuestionIndex + 1) / questions.length) * 100);

      document.getElementById('question-number').innerText = `Pertanyaan ${currentQuestionIndex + 1} dari ${questions.length}`;
      document.getElementById('progress-percent').innerText = `${progressPercent}%`;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      
      document.getElementById('question-image').src = q.image;
      document.getElementById('question-text').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl bg-slate-800/80 hover:bg-indigo-600/20 border border-slate-700/80 hover:border-indigo-500 transition-all text-xs sm:text-sm font-medium text-slate-200 hover:text-white active:scale-[0.99]";
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });
    }

    function selectOption(type) {
      scores[type]++;
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    // FUNGSI SHOWRESULT TERBARU DENGAN INTEGRASI AI
    async function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      // 1. Hitung skor tertinggi
      let winningType = 'kalcer';
      let maxScore = -1;
      for (const [type, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          winningType = type;
        }
      }

      const res = resultsData[winningType];
      document.getElementById('result-title').innerText = res.title;
      document.getElementById('result-subtitle').innerText = res.subtitle;
      document.getElementById('result-desc').innerText = res.desc;
      document.getElementById('result-motto').innerText = res.motto;

      const imgEl = document.getElementById('result-image');
      const loaderEl = document.getElementById('image-loader');

      // Tampilkan indikator loading AI
      imgEl.classList.add('hidden');
      loaderEl.classList.remove('hidden');

      // 2. Request Gambar AI via Serverless Endpoint Vercel
      try {
        const response = await fetch('/api/generate-bike', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: `Photorealistic custom ${res.title}, ${res.subtitle}, cycling lifestyle background, studio lighting, highly detailed, 8k resolution` 
          })
        });
        
        const data = await response.json();
        
        if (data.imageUrl) {
          imgEl.src = data.imageUrl;
        } else {
          throw new Error('Gagal mendapatkan gambar AI');
        }
      } catch (error) {
        console.warn('AI Image Generation error, menggunakan fallback:', error);
        imgEl.src = res.img; // Gunakan gambar fallback standar jika API gagal/habis kuota
      } finally {
        loaderEl.classList.add('hidden');
        imgEl.classList.remove('hidden');
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      scores = { road: 0, mtb: 0, gravel: 0, folding: 0, fixie: 0, kalcer: 0 };
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
