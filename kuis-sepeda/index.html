<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Persona & Gaya Hidup</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --muted-color: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            box-sizing: border-box;
        }

        h2 {
            color: var(--text-color);
            margin-top: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .hidden {
            display: none !important;
        }

        /* Gender Selection Layout (Kiri-Kanan) */
        .gender-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .gender-options {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .gender-card {
            flex: 1;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .gender-card:hover {
            background-color: var(--accent-light);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .gender-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .gender-label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
        }

        /* Progress Bar Styling */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            margin-bottom: 1.25rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-counter {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.9rem 1.2rem;
            border-radius: 10px;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: var(--accent-light);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .result-top-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .result-image-wrapper {
            width: 100%;
            aspect-ratio: 4 / 5; /* Rasio untuk gambar 1080x1350 */
            background-color: #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .result-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .result-desc {
            font-size: 0.95rem;
            color: var(--muted-color);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .restart-btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Responsive untuk Mobile: Menghilangkan background putih container */
        @media (max-width: 768px) {
            body {
                background-color: #ffffff;
                padding: 1rem 0.5rem;
                align-items: flex-start;
            }

            .container {
                background-color: transparent;
                border: none;
                box-shadow: none;
                padding: 1rem;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GENDER SELECTION SCREEN -->
        <div id="gender-screen">
            <div class="gender-title">Pilih jenis kelamin untuk menyesuaikan visual hasil persona:</div>
            <div class="gender-options">
                <div class="gender-card" onclick="selectGender('male')">
                    <div class="gender-icon">👨</div>
                    <div class="gender-label">Pria</div>
                </div>
                <div class="gender-card" onclick="selectGender('female')">
                    <div class="gender-icon">👩</div>
                    <div class="gender-label">Wanita</div>
                </div>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="question-counter" id="question-counter">Pertanyaan 1 dari 8</div>
            <div class="question-text" id="question-text">Memuat pertanyaan...</div>
            <div class="options-list" id="options-list"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden">
            <h2 class="result-top-title">Hasil persona kamu adalah</h2>
            <div class="result-image-wrapper">
                <img id="result-image" src="" alt="Hasil Persona">
            </div>
            <!-- Disembunyikan sesuai permintaan -->
            <span class="result-badge hidden" id="result-badge">Persona Kamu</span>
            <h2 class="result-title hidden" id="result-title">Judul Hasil</h2>
            
            <p class="result-desc" id="result-desc">Deskripsi persona kamu...</p>
            <button class="restart-btn" onclick="restartQuiz()">Ulangi Kuis</button>
        </div>
    </div>

    <script>
        let selectedGender = '';

        const resultsData = {
            road: {
                title: "High-End Carbon Road Bike",
                badge: "Road Bike Enthusiast",
                desc: "Sepeda ini sangat cocok untukmu karena karakternya yang menuntut performa tinggi, efisiensi maksimal, dan kecepatan. Ini selaras dengan pribadimu yang fokus, terstruktur, disiplin, dan selalu berorientasi pada target.",
                imgMale: "road_male.jpg",
                imgFemale: "road_female.jpg"
            },
            mtb: {
                title: "Full-Suspension Mountain Bike",
                badge: "Trail Adventurer",
                desc: "Sepeda ini dirancang khusus untuk melibas rintangan ekstrem, menjadikannya pasangan ideal bagi dirimu yang berani mengambil risiko, tangguh, menyukai tantangan, dan tidak takut keluar dari zona nyaman.",
                imgMale: "mtb_male.jpg",
                imgFemale: "mtb_female.jpg"
            },
            gravel: {
                title: "Steel Gravel Bike & Bikepacking",
                badge: "Gravel Explorer",
                desc: "Fleksibilitas tingkat tinggi pada sepeda ini sangat cocok dengan jiwamu yang adaptif, mandiri, dan gemar melakukan eksplorasi tanpa batas tanpa terikat pada rute atau aturan yang kaku.",
                imgMale: "gravel_male.jpg",
                imgFemale: "gravel_female.jpg"
            },
            folding: {
                title: "Premium Folding E-Bike",
                badge: "Urban Commuter",
                desc: "Karakter sepeda yang ringkas, cerdas secara waktu, dan sangat mendukung mobilitas cepat ini merupakan cerminan sempurna dari gaya hidupmu yang serba praktis, efisien, dan melek teknologi.",
                imgMale: "folding_male.jpg",
                imgFemale: "folding_female.jpg"
            },
            fixie: {
                title: "Minimalist Single-Speed Fixie",
                badge: "Streetwear Rider",
                desc: "Dengan desain minimalis tanpa gir bebas, sepeda ini merepresentasikan jiwamu yang berani, apa adanya, dan sangat menikmati kebebasan berekspresi serta dinamika kultur jalanan kota.",
                imgMale: "fixie_male.jpg",
                imgFemale: "fixie_female.jpg"
            },
            kalcer: {
                title: "Retro 'Kalcer' City Cruiser",
                badge: "Vintage Lifestyle",
                desc: "Sepeda klasik berkarakter seni kuat ini sangat pas untukmu yang memiliki selera estetika tinggi, menghargai detail visual yang autentik, dan menikmati hidup secara santai serta penuh makna.",
                imgMale: "kalcer_male.jpg",
                imgFemale: "kalcer_female.jpg"
            }
        };

        const quizData = [
            {
                question: "1. Bagaimana cara terbaikmu melepas penat setelah seminggu sibuk?",
                options: [
                    { text: "Melaju secepat angin di jalur terbuka yang mulus", type: "road" },
                    { text: "Menantang diri di alam liar yang sunyi", type: "mtb" },
                    { text: "Road trip panjang tanpa rute pasti", type: "gravel" },
                    { text: "Nongkrong santai di kedai kopi estetik perkotaan", type: "kalcer" }
                ]
            },
            {
                question: "2. Prinsip apa yang paling mencerminkan cara kerjamu?",
                options: [
                    { text: "Fokus, terstruktur, dan berorientasi pada target cepat", type: "road" },
                    { text: "Berani mengambil risiko dan tidak takut kotor", type: "mtb" },
                    { text: "Fleksibel dan selalu siap menghadapi kejutan situasi", type: "gravel" },
                    { text: "Praktis, efisien, dan serba ringkas", type: "folding" }
                ]
            },
            {
                question: "3. Apa hal utama yang kamu perhatikan saat membeli pakaian atau gear?",
                options: [
                    { text: "Teknologi tinggi dan aerodinamika/ringan", type: "road" },
                    { text: "Daya tahan ekstrem terhadap benturan dan cuaca", type: "mtb" },
                    { text: "Kenyamanan berlapis untuk perjalanan jarak jauh", type: "gravel" },
                    { text: "Potongan desain klasik vintage yang berkarakter", type: "kalcer" }
                ]
            },
            {
                question: "4. Kalau diberi libur panjang, destinasi mana yang jadi pilihanmu?",
                options: [
                    { text: "Kota metropolitan modern dengan fasilitas serba cepat", type: "folding" },
                    { text: "Pegunungan tinggi atau hutan pinus terpencil", type: "mtb" },
                    { text: "Pedesaan lintas provinsi yang tenang", type: "gravel" },
                    { text: "Distrik seni bersejarah atau area kreatif urban", type: "fixie" }
                ]
            },
            {
                question: "5. Bagaimana gaya komunikasi atau interaksimu dengan orang sekitar?",
                options: [
                    { text: "Jelas, tegas, to the point, dan terukur", type: "road" },
                    { text: "Santai, apa adanya, dan berjiwa bebas", type: "fixie" },
                    { text: "Hangat, menghargai estetika, dan ramah seni", type: "kalcer" },
                    { text: "Adaptif, mandiri, dan berfikiran terbuka", type: "gravel" }
                ]
            },
            {
                question: "6. Apa jenis musik yang paling sering menemani aktivitasmu?",
                options: [
                    { text: "Musik elektronik bertempo cepat yang memacu adrenalin", type: "road" },
                    { text: "Rock alternatif atau instrumen alam yang kuat", type: "mtb" },
                    { text: "Folk, indie, atau acoustic perjalanan", type: "gravel" },
                    { text: "Hip-hop underground atau lo-fi beats urban", type: "fixie" }
                ]
            },
            {
                question: "7. Bagaimana orang lain mendeskripsikan kepribadianmu?",
                options: [
                    { text: "Ambisius dan perfeksionis", type: "road" },
                    { text: "Tangguh dan berjiwa petualang sejati", type: "mtb" },
                    { text: "Dinamis dan cerdas secara waktu", type: "folding" },
                    { text: "Unik, kreatif, dan punya selera seni tinggi", type: "kalcer" }
                ]
            },
            {
                question: "8. Apa motto hidup yang paling mewakili dirimu?",
                options: [
                    { text: "\"Kecepatan dan efisiensi adalah segalanya.\"", type: "road" },
                    { text: "\"Batas diciptakan untuk dilompati.\"", type: "mtb" },
                    { text: "\"Hidup adalah eksplorasi tanpa batas.\"", type: "gravel" },
                    { text: "\"Jadilah autentik dan nikmati tiap momen dengan gaya.\"", type: "fixie" }
                ]
            }
        ];

        let currentQuestion = 0;
        let scores = { road: 0, mtb: 0, gravel: 0, folding: 0, fixie: 0, kalcer: 0 };

        const genderScreen = document.getElementById('gender-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionCounter = document.getElementById('question-counter');
        const questionText = document.getElementById('question-text');
        const optionsList = document.getElementById('options-list');
        const progressBar = document.getElementById('progress-bar');

        function selectGender(gender) {
            selectedGender = gender;
            genderScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            questionCounter.innerText = `Pertanyaan ${currentQuestion + 1} dari ${quizData.length}`;
            questionText.innerText = q.question;
            
            const progressPercentage = ((currentQuestion + 1) / quizData.length) * 100;
            progressBar.style.width = progressPercentage + '%';

            optionsList.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optionsList.appendChild(btn);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            let winningType = 'kalcer';
            let maxScore = -1;
            for (const [type, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    winningType = type;
                }
            }

            const res = resultsData[winningType];
            document.getElementById('result-badge').innerText = res.badge;
            document.getElementById('result-title').innerText = res.title;
            document.getElementById('result-desc').innerText = res.desc;
            
            let imageSource = (selectedGender === 'female') ? res.imgFemale : res.imgMale;
            document.getElementById('result-image').src = imageSource;
        }

        function restartQuiz() {
            currentQuestion = 0;
            selectedGender = '';
            scores = { road: 0, mtb: 0, gravel: 0, folding: 0, fixie: 0, kalcer: 0 };
            resultScreen.classList.add('hidden');
            genderScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
