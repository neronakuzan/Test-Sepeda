<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Persona Sepeda Anak Muda</title>
    <style>
        :root {
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --muted-color: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            box-sizing: border-box;
        }

        h1, h2 {
            color: var(--text-color);
            margin-top: 0;
        }

        .hidden {
            display: none !important;
        }

        /* Quiz Screen Styles */
        .question-counter {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: var(--accent-light);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Result Screen Styles */
        .result-image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .result-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .result-badge {
            display: inline-block;
            background-color: var(--accent-light);
            color: var(--accent-color);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .result-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .result-desc {
            font-size: 0.95rem;
            color: var(--muted-color);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- KUIS SCREEN -->
        <div id="quiz-screen">
            <div class="question-counter" id="question-counter">Pertanyaan 1 dari 3</div>
            <div class="question-text" id="question-text">Memuat pertanyaan...</div>
            <div class="options-list" id="options-list">
                <!-- Opsi jawaban akan dirender lewat JavaScript -->
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden">
            <div class="result-image-wrapper">
                <!-- GAMBAR HASIL: Masukkan path gambar di file JS (resultsData) atau ganti src di sini -->
                <img id="result-image" src="" alt="Hasil Persona Sepeda">
            </div>
            <span class="result-badge" id="result-badge">Persona Kamu</span>
            <h2 class="result-title" id="result-title">Judul Hasil</h2>
            <p class="result-desc" id="result-desc">Deskripsi persona kamu akan muncul di sini...</p>
            <button class="restart-btn" onclick="restartQuiz()">Ulangi Kuis</button>
        </div>
    </div>

    <script>
        // DATA 6 PERSONA & TEMPAT MASUKKAN GAMBAR (src)
        const resultsData = {
            road: {
                title: "High-End Carbon Road Bike",
                badge: "Road Bike Enthusiast",
                desc: "Kamu menyukai kecepatan, efisiensi tinggi, dan tantangan rute aspal mulus jarak jauh dengan performa aerodinamis maksimal.",
                img: "road.jpg" // <-- Masukkan nama file/link gambar road bike di sini
            },
            mtb: {
                title: "Full-Suspension Mountain Bike",
                badge: "Trail Adventurer",
                desc: "Jiwa penjelajah alam bebas melekat pada dirimu. Jalur terjal, tanah berlumpur, dan rintangan alam adalah arena bermain favoritmu.",
                img: "mtb.jpg" // <-- Masukkan nama file/link gambar mtb di sini
            },
            gravel: {
                title: "Steel Gravel Bike & Bikepacking",
                badge: "Gravel Explorer",
                desc: "Fleksibel dan siap menempuh segala medan. Kamu suka petualangan jarak jauh tanpa batas dengan perlengkapan bikepacking lengkap.",
                img: "gravel.jpg" // <-- Masukkan nama file/link gambar gravel di sini
            },
            folding: {
                title: "Premium Folding E-Bike",
                badge: "Urban Commuter",
                desc: "Praktis, efisien, dan melek teknologi. Mobilitas perkotaan yang cepat serta gaya hidup urban modern adalah gaya utamamu.",
                img: "folding.jpg" // <-- Masukkan nama file/link gambar folding di sini
            },
            fixie: {
                title: "Minimalist Single-Speed Fixie",
                badge: "Streetwear Rider",
                desc: "Sederhana, berani, dan lekat dengan kultur jalanan kota. Kamu mengeksplorasi estetika urban malam hari dengan gaya streetwear khas.",
                img: "fixie.jpg" // <-- Masukkan nama file/link gambar fixie di sini
            },
            kalcer: {
                title: "Retro 'Kalcer' City Cruiser",
                badge: "Vintage Lifestyle",
                desc: "Gaya estetika klasik, santai, dan penuh karakter seni. Kamu menikmati bersepeda santai menuju spot kopi hits di perkotaan.",
                img: "kalcer.jpg" // <-- Masukkan nama file/link gambar kalcer di sini
            }
        };

        // PERTANYAAN KUIS (Bisa ditambah/sesuaikan)
        const quizData = [
            {
                question: "Bagaimana cara idealmu menghabiskan akhir pekan di atas sepeda?",
                options: [
                    { text: "Melaju kencang di jalan raya aspal mulus pagi hari", type: "road" },
                    { text: "Menembus jalur hutan terjal dan lumpur pegunungan", type: "mtb" },
                    { text: "Berpetualang melintasi jalur kerikil antarkota", type: "gravel" }
                ]
            },
            {
                question: "Gaya pakaian apa yang paling mencerminkan kepribadianmu?",
                options: [
                    { text: "Jersey aero ketat minimalis dengan topi performance", type: "road" },
                    { text: "Kemeja camp collar vintage, korduroi, dan loafers", type: "kalcer" },
                    { text: "Kaos oversized streetwear, denim robek, dan sneakers", type: "fixie" }
                ]
            },
            {
                question: "Pilih suasana lingkungan kota/alam yang paling kamu sukai:",
                options: [
                    { text: "Gedung perkantoran modern dengan dinding kaca & arsitektur bersih", type: "folding" },
                    { text: "Spot kafe estetik perkotaan dengan nuansa retro hangat", type: "kalcer" },
                    { text: "Alam liar bebas tanpa batas cakrawala terbuka", type: "gravel" }
                ]
            }
        ];

        let currentQuestion = 0;
        let scores = { road: 0, mtb: 0, gravel: 0, folding: 0, fixie: 0, kalcer: 0 };

        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionCounter = document.getElementById('question-counter');
        const questionText = document.getElementById('question-text');
        const optionsList = document.getElementById('options-list');

        function loadQuestion() {
            const q = quizData[currentQuestion];
            questionCounter.innerText = `Pertanyaan ${currentQuestion + 1} dari ${quizData.length}`;
            questionText.innerText = q.question;
            optionsList.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optionsList.appendChild(btn);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            // Cari tipe sepeda dengan skor tertinggi
            let winningType = 'kalcer';
            let maxScore = -1;
            for (const [type, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    winningType = type;
                }
            }

            const res = resultsData[winningType];
            document.getElementById('result-badge').innerText = res.badge;
            document.getElementById('result-title').innerText = res.title;
            document.getElementById('result-desc').innerText = res.desc;
            document.getElementById('result-image').src = res.img;
        }

        function restartQuiz() {
            currentQuestion = 0;
            scores = { road: 0, mtb: 0, gravel: 0, folding: 0, fixie: 0, kalcer: 0 };
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        // Jalankan kuis saat pertama dibuka
        loadQuestion();
    </script>
</body>
</html>
